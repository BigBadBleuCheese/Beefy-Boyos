name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.7
    steps:
      - uses: actions/checkout@v4
      - run: python build.py
      - uses: actions/upload-artifact@v7
        with:
          path: dist/CodeBleu-BeefyBoyos.ts4script
          archive: false