name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.7
    steps:
      - uses: actions/checkout@v4
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: beefy_boyos
          path: dist/beefy_boyos.ts4script